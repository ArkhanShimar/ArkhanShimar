name: Refresh profile dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update-stats.mjs
      - .github/workflows/profile-stats.yml
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public data and generate SVG cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-stats.mjs
      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/overview.svg assets/contributions.svg assets/languages.svg assets/activity.svg assets/streak.svg assets/github-data.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh profile dashboard"
            git push
          fi
